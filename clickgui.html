
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090711">
  <title>Sbalish Click GUI</title>
  <style>
    :root {
      --bg: #090711;
      --panel: #151222;
      --panel2: #201832;
      --purple: #a15cff;
      --text: #f7f2ff;
      --muted: #a69bbd;
      --border: #342544;
      --green: #7bffbd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse at top, #211338 0%, #090711 48%);
      color: var(--text);
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 600px; margin: auto; padding: 18px 14px 35px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { font-size: 19px; font-weight: 900; letter-spacing: 1px; }
    .brand span { color: var(--purple); }
    .subtitle { color: var(--muted); font-size: 10px; letter-spacing: 2px; margin-top: 5px; }
    .back {
      color: white; background: #211832; border: 1px solid #49315f;
      border-radius: 10px; padding: 10px 12px;
    }
    .hero {
      margin: 22px 0 16px; padding: 20px;
      border: 1px solid #49315f; border-radius: 18px;
      background: linear-gradient(130deg, #2b1943, #151020);
    }
    .badge {
      display: inline-block; padding: 5px 9px; border-radius: 20px;
      color: #d9b8ff; background: #37204f; font-size: 10px;
      letter-spacing: 1px;
    }
    h1 { font-size: 27px; margin: 12px 0 6px; }
    p { color: var(--muted); line-height: 1.5; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
    .stat { padding: 12px 5px; text-align: center; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
    .stat strong { display: block; font-size: 19px; }
    .stat span { color: var(--muted); font-size: 10px; }
    .search {
      width: 100%; padding: 13px; color: white; background: #100d19;
      border: 1px solid var(--border); border-radius: 11px; outline: none;
    }
    .tabs { display: flex; gap: 7px; overflow-x: auto; padding: 13px 0; }
    .tab {
      flex-shrink: 0; padding: 9px 13px; color: var(--muted);
      border: 1px solid var(--border); background: var(--panel);
      border-radius: 10px;
    }
    .tab.active { color: white; background: #4a2670; border-color: var(--purple); }
    .group-title { color: #c9a4ff; font-size: 11px; letter-spacing: 2px; margin: 18px 0 10px; }
    .feature {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; margin-bottom: 9px;
      background: linear-gradient(110deg, var(--panel), #110e1b);
      border: 1px solid var(--border); border-radius: 14px;
    }
    .feature-icon {
      width: 42px; height: 42px; flex-shrink: 0;
      display: grid; place-items: center; font-size: 20px;
      background: var(--panel2); border: 1px solid #3d2b53;
      border-radius: 12px;
    }
    .feature-info { min-width: 0; flex: 1; }
    .feature-info h3 { font-size: 14px; margin: 0 0 5px; }
    .feature-info p { font-size: 11px; margin: 0; }
    .toggle {
      position: relative; width: 46px; height: 26px; flex-shrink: 0;
      border: 1px solid #51435e; background: #332a3e;
      border-radius: 30px; transition: .2s;
    }
    .toggle::after {
      content: ""; position: absolute; width: 18px; height: 18px;
      left: 3px; top: 3px; border-radius: 50%;
      background: #b3a8c2; transition: .2s;
    }
    .toggle.on { background: #6337a0; border-color: var(--purple); }
    .toggle.on::after { left: 23px; background: white; }
    .toggle:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid white; outline-offset: 3px; }
    .footer { margin-top: 20px; padding: 14px; text-align: center; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 12px; }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    .reset { margin-top: 12px; padding: 10px 12px; color: white; background: #211832; border: 1px solid #49315f; border-radius: 10px; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="brand">SBALISH <span>CLIENT</span></div>
      <div class="subtitle">CLICK GUI · BEDROCK COMPANION</div>
    </div>
    <button class="back" onclick="goBack()">← Back</button>
  </header>

  <section class="hero">
    <span class="badge">BETA INTERFACE</span>
    <h1>Click GUI</h1>
    <p>Manage your visible feature preferences from one menu.</p>
    <div class="stats">
      <div class="stat"><strong id="totalCount">0</strong><span>FEATURES</span></div>
      <div class="stat"><strong id="enabledCount">0</strong><span>ENABLED</span></div>
      <div class="stat"><strong>1.0</strong><span>VERSION</span></div>
    </div>
  </section>

  <input id="search" class="search" type="search" placeholder="Search features..." autocomplete="off">

  <div class="tabs" id="tabs">
    <button class="tab active" data-category="All">All Features</button>
    <button class="tab" data-category="HUD">HUD</button>
    <button class="tab" data-category="Movement">Movement</button>
    <button class="tab" data-category="Utility">Utility</button>
  </div>

  <div id="featureList"></div>

  <button class="reset" id="resetButton">Reset all switches</button>

  <div class="footer">
    Prototype interface only. These switches save their visual state on this device.
    They do not inject into, modify, or control Minecraft.
  </div>
</div>

<script>
  const features = [
    { id: 'custom-hud', name: 'Custom HUD', icon: '▦', category: 'HUD', description: 'Prototype HUD preference switch.' },
    { id: 'keystrokes', name: 'Keystrokes', icon: '⌨️', category: 'HUD', description: 'Toggle the keystrokes display preference.' },
    { id: 'fps-counter', name: 'FPS Counter', icon: '📊', category: 'HUD', description: 'Toggle the FPS display preference.' },
    { id: 'coordinates', name: 'Coordinates', icon: '⌖', category: 'HUD', description: 'Toggle the coordinates display preference.' },
    { id: 'armor-hud', name: 'Armor HUD', icon: '🛡️', category: 'HUD', description: 'Toggle the armor display preference.' },
    { id: 'sprint', name: 'Sprint', icon: '🏃', category: 'Movement', description: 'Save your sprint preference.' },
    { id: 'toggle-sprint', name: 'Toggle Sprint', icon: '⚡', category: 'Movement', description: 'Save the toggle-sprint preference.' },
    { id: 'motion-effects', name: 'Motion Effects', icon: '〰️', category: 'Movement', description: 'Save a visual motion preference.' },
    { id: 'waypoints', name: 'Waypoints', icon: '📍', category: 'Utility', description: 'Save your waypoint feature preference.' },
    { id: 'quick-tools', name: 'Quick Tools', icon: '🧰', category: 'Utility', description: 'Save the quick-tools preference.' },
    { id: 'chat-helper', name: 'Chat Helper', icon: '💬', category: 'Utility', description: 'Save the chat-helper preference.' },
    { id: 'compact-menu', name: 'Compact Menu', icon: '▤', category: 'Utility', description: 'Save a compact-menu preference.' }
  ];

  let selectedCategory = 'All';
  let enabled = {};

  try {
    enabled = JSON.parse(localStorage.getItem('sbalish-clickgui-state') || '{}');
    if (!enabled || typeof enabled !== 'object' || Array.isArray(enabled)) enabled = {};
  } catch (error) {
    enabled = {};
  }

  const list = document.getElementById('featureList');
  const search = document.getElementById('search');

  function saveState() {
    try {
      localStorage.setItem('sbalish-clickgui-state', JSON.stringify(enabled));
    } catch (error) {}
  }

  function updateStats() {
    document.getElementById('totalCount').textContent = features.length;
    document.getElementById('enabledCount').textContent =
      features.filter(feature => enabled[feature.id] === true).length;
  }

  function renderFeatures() {
    const query = search.value.trim().toLowerCase();

    const visible = features.filter(feature => {
      const matchesCategory = selectedCategory === 'All' || feature.category === selectedCategory;
      const matchesSearch = (feature.name + ' ' + feature.description + ' ' + feature.category)
        .toLowerCase().includes(query);
      return matchesCategory && matchesSearch;
    });

    list.innerHTML = '';

    if (visible.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No matching features found.';
      list.appendChild(empty);
      updateStats();
      return;
    }

    let lastCategory = '';

    visible.forEach(feature => {
      if (selectedCategory === 'All' && feature.category !== lastCategory) {
        lastCategory = feature.category;
        const heading = document.createElement('div');
        heading.className = 'group-title';
        heading.textContent = feature.category.toUpperCase();
        list.appendChild(heading);
      }

      const row = document.createElement('div');
      row.className = 'feature';

      const icon = document.createElement('div');
      icon.className = 'feature-icon';
      icon.textContent = feature.icon;

      const info = document.createElement('div');
      info.className = 'feature-info';

      const title = document.createElement('h3');
      title.textContent = feature.name;

      const description = document.createElement('p');
      description.textContent = feature.description;

      info.append(title, description);

      const toggle = document.createElement('button');
      const isOn = enabled[feature.id] === true;
      toggle.className = 'toggle' + (isOn ? ' on' : '');
      toggle.type = 'button';
      toggle.setAttribute('role', 'switch');
      toggle.setAttribute('aria-checked', String(isOn));
      toggle.setAttribute('aria-label', feature.name);

      toggle.addEventListener('click', () => {
        enabled[feature.id] = !(enabled[feature.id] === true);
        saveState();
        renderFeatures();
      });

      row.append(icon, info, toggle);
      list.appendChild(row);
    });

    updateStats();
  }

  document.getElementById('tabs').addEventListener('click', event => {
    const button = event.target.closest('button[data-category]');
    if (!button) return;

    selectedCategory = button.dataset.category;

    document.querySelectorAll('.tab').forEach(tab => {
      tab.classList.toggle('active', tab === button);
    });

    renderFeatures();
  });

  search.addEventListener('input', renderFeatures);

  document.getElementById('resetButton').addEventListener('click', () => {
    enabled = {};
    saveState();
    renderFeatures();
  });

  function goBack() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = './index.html';
    }
  }

  renderFeatures();
</script>
</body>
</html>
