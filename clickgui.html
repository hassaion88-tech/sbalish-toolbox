
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090710">
<title>Sbalish Client | Click GUI</title>
<style>
:root {
  --bg:#090710;
  --panel:#14101f;
  --panel2:#1c162b;
  --purple:#a855f7;
  --text:#f5f0ff;
  --muted:#a69ab9;
  --border:#302440;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;min-height:100vh;
}
header{
  padding:22px 17px 16px;
  background:linear-gradient(135deg,#211037,#0d0a16);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:46px;height:46px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#c084fc,#7028d9);
  color:white;font-size:23px;font-weight:900;
  box-shadow:0 0 24px #a855f744;
}
h1{font-size:20px;margin:0 0 5px}
.subtitle{font-size:12px;color:var(--muted)}
.status{
  margin-top:16px;display:flex;justify-content:space-between;
  gap:8px;font-size:12px;color:var(--muted);
}
.status b{color:#d8b4fe}
main{padding:16px;max-width:700px;margin:auto}
.search{
  width:100%;padding:14px;border-radius:12px;
  border:1px solid var(--border);background:var(--panel);
  color:var(--text);font-size:15px;outline:none;
}
.search:focus{border-color:var(--purple)}
.tabs{
  display:flex;gap:8px;overflow-x:auto;
  padding:14px 0;scrollbar-width:none;
}
.tab{
  white-space:nowrap;border:1px solid var(--border);
  background:var(--panel);color:var(--muted);
  border-radius:10px;padding:10px 13px;font-size:12px;
}
.tab.active{
  color:white;background:#512080;border-color:var(--purple);
}
.section-title{
  display:flex;justify-content:space-between;align-items:center;
  margin:12px 0;font-size:14px;font-weight:bold;
}
.section-title small{color:var(--muted);font-weight:normal}
.feature{
  display:flex;align-items:center;gap:12px;
  padding:14px;margin-bottom:9px;border-radius:14px;
  background:var(--panel);border:1px solid var(--border);
}
.feature-icon{
  width:43px;height:43px;flex-shrink:0;
  display:grid;place-items:center;border-radius:12px;
  background:var(--panel2);font-size:20px;
}
.info{flex:1;min-width:0}
.info strong{display:block;font-size:14px;margin-bottom:5px}
.info small{color:var(--muted);font-size:11px}
.switch{
  width:47px;height:27px;flex-shrink:0;border:0;
  border-radius:30px;background:#393144;padding:3px;
  transition:.2s;cursor:pointer;
}
.switch span{
  display:block;width:21px;height:21px;border-radius:50%;
  background:white;transition:.2s;
}
.switch.on{background:var(--purple)}
.switch.on span{transform:translateX(20px)}
.notice{
  margin-top:18px;padding:13px;border-radius:12px;
  background:#171020;border:1px solid #453054;
  color:#c4b5d7;font-size:12px;line-height:1.6;
}
footer{text-align:center;color:#756986;font-size:11px;padding:22px}
.empty{padding:25px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">S</div>
    <div>
      <h1>SBALISH CLIENT</h1>
      <div class="subtitle">BEDROCK • CLICK GUI</div>
    </div>
  </div>
  <div class="status">
    <span>CLIENT <b>PROTOTYPE</b></span>
    <span id="counter">0 ENABLED</span>
  </div>
</header>

<main>
  <input id="search" class="search"
    placeholder="⌕  Search features..."
    aria-label="Search features">

  <div class="tabs" id="tabs">
    <button class="tab active" data-category="All">All</button>
    <button class="tab" data-category="HUD">HUD</button>
    <button class="tab" data-category="Movement">Movement</button>
    <button class="tab" data-category="Utility">Utility</button>
  </div>

  <div class="section-title">
    <span id="sectionName">ALL FEATURES</span>
    <small id="shown">0 features</small>
  </div>

  <div id="features"></div>

  <div class="notice">
    <b>Prototype mode</b><br>
    These switches control this interface only.
    They do not activate modifications inside Minecraft yet.
    Close and reopen this page to test saved settings.
  </div>
</main>

<footer>SBALISH CLIENT • MADE FOR BEDROCK</footer>

<script>
const featureData = [
  {id:"hud",name:"Custom HUD",icon:"▦",cat:"HUD",
   desc:"HUD display prototype"},
  {id:"keystrokes",name:"Keystrokes",icon:"⌨",cat:"HUD",
   desc:"Movement key display prototype"},
  {id:"fps",name:"FPS Counter",icon:"◷",cat:"HUD",
   desc:"Performance display prototype"},
  {id:"sprint",name:"Sprint",icon:"➜",cat:"Movement",
   desc:"Movement feature prototype"},
  {id:"toggle_sprint",name:"Toggle Sprint",icon:"⚡",cat:"Movement",
   desc:"Sprint toggle prototype"},
  {id:"coordinates",name:"Coordinates",icon:"⌖",cat:"Utility",
   desc:"Coordinate display prototype"},
  {id:"waypoints",name:"Waypoints",icon:"◇",cat:"Utility",
   desc:"Waypoint manager prototype"}
];

let currentCategory = "All";
let enabled = {};

try {
  enabled = JSON.parse(
    localStorage.getItem("sbalish-clickgui") || "{}"
  );
} catch(e) {
  enabled = {};
}

const list = document.getElementById("features");
const search = document.getElementById("search");

function render() {
  const query = search.value.trim().toLowerCase();
  const filtered = featureData.filter(f =>
    (currentCategory === "All" || f.cat === currentCategory) &&
    (f.name.toLowerCase().includes(query) ||
     f.desc.toLowerCase().includes(query))
  );

  list.innerHTML = "";
  document.getElementById("sectionName").textContent =
    currentCategory.toUpperCase() + " FEATURES";
  document.getElementById("shown").textContent =
    filtered.length + " features";

  document.getElementById("counter").textContent =
    Object.values(enabled).filter(Boolean).length + " ENABLED";

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">No features found</div>';
    return;
  }

  filtered.forEach(f => {
    const active = !!enabled[f.id];
    const card = document.createElement("div");
    card.className = "feature";

    const icon = document.createElement("div");
    icon.className = "feature-icon";
    icon.textContent = f.icon;

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("strong");
    title.textContent = f.name;

    const desc = document.createElement("small");
    desc.textContent = f.desc;

    info.append(title, desc);

    const button = document.createElement("button");
    button.className = "switch" + (active ? " on" : "");
    button.type = "button";
    button.setAttribute("role", "switch");
    button.setAttribute("aria-checked", String(active));
    button.setAttribute("aria-label", "Toggle " + f.name);

    const knob = document.createElement("span");
    button.appendChild(knob);

    button.addEventListener("click", () => {
      enabled[f.id] = !enabled[f.id];
      try {
        localStorage.setItem(
          "sbalish-clickgui", JSON.stringify(enabled)
        );
      } catch(e) {}
      render();
    });

    card.append(icon, info, button);
    list.appendChild(card);
  });
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    currentCategory = tab.dataset.category;
    document.querySelectorAll(".tab").forEach(t =>
      t.classList.toggle("active", t === tab)
    );
    render();
  });
});

search.addEventListener("input", render);
render();
</script>
</body>
</html>
